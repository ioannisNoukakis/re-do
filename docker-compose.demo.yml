services:
  rabbitMQ:
    image: rabbitmq:3-management
    container_name: redo-rabbitmq-demo
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=example
    ports:
      - "5673:5672"
      - "5051:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongoDB:
    image: mongo:7.0.31
    container_name: redo-mongodb-demo
    hostname: mongoDB
    command: --replSet s0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: test $$(mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'s0',members:[{_id:0,host:'mongoDB:27017'}]}).ok }") -eq 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90
    container_name: redo-rustfs-demo
    environment:
      - RUSTFS_ACCESS_KEY=root
      - RUSTFS_SECRET_KEY=example
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - rustfs-data:/data

  scheduler:
    build:
      context: .
      dockerfile: adapter_driving_scheduler_spring/Dockerfile
    container_name: redo-scheduler-demo
    environment:
      - SPRING_RABBITMQ_HOST=rabbitMQ
      - SPRING_MONGODB_HOST=mongoDB
      - SCHEDULER_MESSAGING_MODE=rabbitmq
      - SCHEDULER_PERSISTENCE_MODE=mongodb
      - SCHEDULER_FILE_STORAGE_MODE=s3
      - SCHEDULER_FILE_REFERENCE_STORE_MODE=mongodb
      - SCHEDULER_MUTUAL_EXCLUSION_LOCK_MODE=mongodb
      - SCHEDULER_FILE_STORAGE_S3_ENDPOINT=http://rustfs:9000
    ports:
      - "8080:8080"
    depends_on:
      rabbitMQ:
        condition: service_healthy
      mongoDB:
        condition: service_healthy
      rustfs:
        condition: service_started

  runner-ffmpeg:
    build:
      context: .
      dockerfile: adapter_driving_runner_spring/Dockerfile
      args:
        TASK_IMPLS: "task_impl_ffmpeg"
        INCLUDE_FFMPEG: "true"
    container_name: redo-runner-ffmpeg-demo
    environment:
      - SPRING_RABBITMQ_HOST=rabbitMQ
      - RUNNER_FILE_STORAGE_S3_ENDPOINT=http://rustfs:9000
    depends_on:
      rabbitMQ:
        condition: service_healthy
      rustfs:
        condition: service_started

  runner-tasks:
    build:
      context: .
      dockerfile: adapter_driving_runner_spring/Dockerfile
      args:
        TASK_IMPLS: "task_impl_demo task_impl_http_fetch task_impl_llm_summarise task_impl_llm_translate task_impl_whisper_transcription"
    container_name: redo-runner-tasks-demo
    environment:
      - SPRING_RABBITMQ_HOST=rabbitMQ
      - RUNNER_FILE_STORAGE_S3_ENDPOINT=http://rustfs:9000
      - LLM_API_KEY=FILLME
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_DEBUG_LOGGING=true
      - LLM_DEFAULT_MODEL=gemma4:e4b
      - LLM_SUMMARISE_CONTEXT_WINDOW_TOKENS=128000
      - LLM_SUMMARISE_MAX_TOKENS=1024
      - LLM_SUMMARISE_MODEL=translategemma:4b
      - LLM_TRANSLATE_CONTEXT_WINDOW_TOKENS=2000
      - LLM_TRANSLATE_MAX_TOKENS=2048
      - LLM_TRANSLATE_MODEL=translategemma:4b
      - OPENAI_API_KEY=FILLME
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_MODEL_NAME=Systran/faster-whisper-large-v3
    depends_on:
      rabbitMQ:
        condition: service_healthy
      rustfs:
        condition: service_started

volumes:
  mongo-data:
  rustfs-data:
