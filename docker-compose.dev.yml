services:
  rabbitMQ:
    image: rabbitmq:3-management
    container_name: redo-rabbitmq-dev
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=example
    ports:
      - "5672:5672"
      - "5050:15672"
  mongoDB:
    image: mongo:7.0.31
    container_name: redo-mongodb-dev
    hostname: mongoDB
    command: --replSet s0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: test $$(mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'s0',members:[{_id:0,host:'localhost:27017'}]}).ok }") -eq 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90
    container_name: redo-rustfs-dev
    environment:
      - RUSTFS_ACCESS_KEY=root
      - RUSTFS_SECRET_KEY=example
    ports:
      - "9000:9000"
      - "9001:9001" # console
    volumes:
      - rustfs-data:/data
volumes:
    mongo-data:
    rustfs-data: