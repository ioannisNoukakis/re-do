spring:
  application:
    name: Scheduler Primary Spring Adapter
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: example
  mongodb:
    host: localhost
    port: 27017
    database: scheduler
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

scheduler:
  max-failures-before-giving-up: 3
  auth:
    mode: "headers"                                   # disabled | headers | oidc
    # disabled: no authentication; default-principal/default-roles are used for every request.
    # headers : trust X-Auth-Principal / X-Auth-Roles from an upstream gateway.
    # oidc    : require a Bearer JWT validated against the configured OIDC issuer.
    default-principal: "anonymous"                    # Principal used when mode is "disabled".
    default-roles: ""                                 # Comma-separated roles used when mode is "disabled".
    required-roles: ""                                # Comma-separated. If non-empty, caller must have at least one of these roles or the request is rejected with 403.
    oidc:
      issuer-uri: ""                                  # e.g. https://login.example.com/realms/re-do
      audience: ""                                    # Optional. If set, the JWT 'aud' claim must contain this value.
      roles-claim: "roles"                            # Dotted JSON path inside the JWT to read roles from. Examples: "roles", "realm_access.roles", "resource_access.re-do.roles".
      principal-claim: "sub"                          # Which JWT claim to use as the principal (identity.sub).
  messaging: # Either "in-memory" or "rabbitmq"
    mode: "in-memory"
  persistence: # Either "in-memory" or "mongodb"
    mode: "in-memory"
  rabbitmq:
    task-exchange: "teg.tasks"
    reply-exchange: "teg.results"
    reply-queue: "teg.scheduler.updates"           # queue where runners send results back
    reply-routing-key: "#"                         # catch-all from the results exchange
    dead-letter-exchange: "teg.scheduler.dead-letter"
    dead-letter-routing-key: "scheduler.dead-letter"
  mongodb:
    cursor-batch-size-for-get-all-teg-not-events: 100
    teg-event-lookback-duration: 30d
  file-storage: # Either "in-memory" or "s3"
    mode: "in-memory"
    s3:
      endpoint: "http://localhost:9000"
      bucket: "scheduler-files"
      access-key: "root"
      secret-key: "example"
      region: "us-east-1"
  file-reference-store: # Either "in-memory" or "mongodb"
    mode: "in-memory"
  mutual-exclusion-lock:
    mode: "in-memory" # Either "in-memory" or "mongodb"
    retry-interval: 500ms
    timeout: 30s
