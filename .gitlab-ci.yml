stages:
  - security
  - notify
  - test
  - ai

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

gitleaks_scan:
  stage: security
  image: zricethezav/gitleaks:v8.30.0
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --verbose --source . --report-format json --report-path gitleaks-report.json
  artifacts:
    reports:
      # GitLab can parse this for security dashboard
      secret_detection: gitleaks-report.json
    paths:
      - gitleaks-report.json
    when: always
    expire_in: 1 week

notify_alert_failure:
  stage: notify
  image: curlimages/curl:8.18.0
  script:
    - export SECRET_COUNT=$(cat gitleaks-report.json | grep -o '"Description":' | wc -l || echo "0")
    - |
      curl -X POST "${GOTIFY_NOTIFICATION_URL}" \
        -F "title=🚨 *SECURITY ALERT: SECRETS DETECTED!* 🚨" \
        -F "message=Project: ${CI_PROJECT_NAME}\nBranch: ${CI_COMMIT_REF_NAME}\nSecrets Found: ${SECRET_COUNT}\nCommit: ${CI_COMMIT_SHORT_SHA}\nAuthor: ${GITLAB_USER_NAME}\nPipeline: ${CI_PIPELINE_URL}" \
        -F "priority=10"
  dependencies:
    - gitleaks_scan
  when: on_failure

gradle_test:
  stage: test
  image: gradle:9.3.1-noble
  services:
    - docker:29.1.3-dind
  before_script:
    - until docker info; do sleep 1; done
  script:
    - gradle test

claude:
  stage: ai
  image: node:24-alpine3.21
  # Adjust rules to fit how you want to trigger the job:
  # - manual runs
  # - merge request events
  # - web/API triggers when a comment contains '@claude'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apk update
    - apk add --no-cache git curl bash
    - curl -fsSL https://claude.ai/install.sh | bash
  script:
    # Use AI_FLOW_* variables when invoking via web/API triggers with context payloads
    - echo "$AI_FLOW_INPUT for $AI_FLOW_CONTEXT on $AI_FLOW_EVENT"
    - >
      claude
      -p "${AI_FLOW_INPUT:-'Review this MR and implement the requested changes'}"
      --permission-mode acceptEdits
      --allowedTools "Bash Read Edit Write mcp__gitlab"
      --model claude-sonnet-4-6
      --debug